# HWDT — Prometheus configuration (monitoring foundation)
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: hwdt
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Container status, CPU, memory, filesystem per container
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [name]
        regex: "hwdt-.*"
        action: keep

  # Host CPU, memory, disk
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
