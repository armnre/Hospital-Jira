# HWDT — Jira virtual host  (http://jira.local -> jira:8080)
server {
    listen 80;
    server_name jira.local;

    include /etc/nginx/snippets/security-headers.conf;

    set $jira_upstream jira:8080;

    location = /login.jsp {
        limit_req zone=hwdt_login burst=20 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$jira_upstream;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$jira_upstream;
    }

    location @upstream_starting {
        default_type text/plain;
        return 503 "Jira is starting up (first boot can take several minutes). Please retry shortly.\n";
    }
}

