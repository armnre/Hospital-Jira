# HWDT Phase 1: Workforce app (http://hwdt.local)
#   /api/v1/*  -> backend:4000  (Express API)
#   /*         -> frontend:3000 (Next.js React app)
server {
    listen 80;
    server_name hwdt.local;

    include /etc/nginx/snippets/security-headers.conf;

    set $backend_upstream backend:4000;
    set $frontend_upstream frontend:3000;

    location = /api/v1/auth/login {
        limit_req zone=hwdt_login burst=10 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$backend_upstream;
    }

    location /api/v1/ {
        client_max_body_size 1m;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$backend_upstream;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$frontend_upstream;
    }

    location @upstream_starting {
        default_type text/plain;
        return 503 "HWDT workforce app is starting up. Please retry shortly.\n";
    }
}
