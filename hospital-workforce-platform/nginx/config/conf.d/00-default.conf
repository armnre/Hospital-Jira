# HWDT — default server: health endpoint + reject unknown Host headers
server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = / {
        default_type text/plain;
        return 200 "HWDT reverse proxy. Use http://jira.local, http://confluence.local or http://monitoring.local\n";
    }

    location / {
        return 444;   # close connection for unknown hosts/paths
    }
}
