# HWDT — Confluence virtual host  (http://confluence.local -> confluence:8090)
server {
    listen 80;
    server_name confluence.local;

    include /etc/nginx/snippets/security-headers.conf;

    set $confluence_upstream confluence:8090;

    location = /dologin.action {
        limit_req zone=hwdt_login burst=20 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$confluence_upstream;
    }

    # Collaborative editing (Synchrony is proxied by Confluence itself on /synchrony)
    location /synchrony {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 3600s;
        proxy_pass http://$confluence_upstream;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$confluence_upstream;
    }

    location @upstream_starting {
        default_type text/plain;
        return 503 "Confluence is starting up (first boot can take several minutes). Please retry shortly.\n";
    }
}

