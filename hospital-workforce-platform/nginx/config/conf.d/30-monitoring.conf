# HWDT — Monitoring virtual host  (http://monitoring.local -> prometheus:9090)
server {
    listen 80;
    server_name monitoring.local;

    include /etc/nginx/snippets/security-headers.conf;

    # Restrict to private networks (developer workstation / docker networks)
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    set $prometheus_upstream prometheus:9090;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://$prometheus_upstream;
    }

    location @upstream_starting {
        default_type text/plain;
        return 503 "Prometheus is starting up.\n";
    }
}
