# HWDT — Nginx main configuration (reverse proxy for Jira / Confluence / Monitoring)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  hwdt  '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  hwdt;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;             # hide nginx version
    client_max_body_size 100m;          # Jira/Confluence attachments

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker embedded DNS — upstreams are resolved lazily so nginx starts even
    # while Jira/Confluence containers are still booting.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # WebSocket upgrade support (Confluence collaborative editing / Synchrony)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Basic abuse protection
    limit_req_zone $binary_remote_addr zone=hwdt_login:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
