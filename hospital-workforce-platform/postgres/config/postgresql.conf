# HWDT — PostgreSQL 15 configuration (sized for a single-host dev/prototype stack)
listen_addresses = '*'
port = 5432
max_connections = 300                # Jira (~100 pool) + Confluence (~60 pool) + tooling

# Memory
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# WAL / durability
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Security
password_encryption = scram-sha-256

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000    # log queries slower than 1s
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# Locale / misc
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
